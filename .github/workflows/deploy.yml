name: Build & deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 16 * * *"   # 00:05 Hong Kong time daily – drops expired promotions
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Generate pages (Hong Kong date)
        run: BUILD_DATE=$(TZ=Asia/Hong_Kong date +%F) python _build/generate.py
      - name: Assemble publish folder
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_build' --exclude '_site' --exclude 'content' --exclude '.pages.yml' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
